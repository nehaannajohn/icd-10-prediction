[project]
name = "icd10-uncertainty"
version = "0.1.0"
description = "ICD-10-CM code prediction from clinical transcripts with per-code uncertainty estimation"
requires-python = ">=3.12"
dependencies = [
    "boto3",        # Bedrock runtime (Converse API)
    "pandas",
    "numpy",
    "pyyaml",       # config.yaml
    "matplotlib",   # reliability diagrams, risk-coverage curves
    "streamlit",    # interactive UI
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
markers = ["integration: calls Bedrock; deselect with -m 'not integration'"]
